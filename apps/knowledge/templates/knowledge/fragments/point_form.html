<form id="kp-form"
      method="post"
      {% if action == 'new' %}
      action="/knowledge/point/new/submit/"
      {% else %}
      action="/knowledge/point/{{ point.id }}/update/"
      {% endif %}
      hx-target="#kp-table">
  {% csrf_token %}
  <input type="hidden" name="subject" value="{{ subject }}">
  <input type="hidden" name="stage" value="{{ stage }}">
  <input type="hidden" name="grade_index" value="{{ grade_index }}">
  <input type="hidden" name="term" value="{{ term }}">
  <label>章节<input name="chapter" value="{{ chapter }}"></label>
  <label>模块<input name="module" value="{{ module }}"></label>
  <label>类型<input name="node_type" value="{{ node_type }}"></label>
  <label>内容<textarea name="content">{{ content }}</textarea></label>
  <button type="submit">保存</button>
</form>
