<div id="kp-table" class="kp-table">
  <h3>{{ chapter_name }}</h3>
  <table>
    <thead>
      <tr><th>模块</th><th>类型</th><th>内容</th><th>操作</th></tr>
    </thead>
    <tbody>
      {% for point in points %}
      <tr>
        <td>{{ point.module }}</td>
        <td>{{ point.get_node_type_display }}</td>
        <td>{{ point.content }}</td>
        <td><button hx-post="/knowledge/point/{{ point.id }}/delete/" hx-target="#kp-table">删除</button></td>
      </tr>
      {% empty %}
      <tr><td colspan="4">暂无知识点</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
