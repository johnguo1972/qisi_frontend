[prompt:question_probe]
template = 请分析题目 {question_text}，识别题型、已知条件与待求目标，仅返回约定 JSON。

[prompt:knowledge_analysis]
template = 请基于题目 {question_text} 分析所需知识点、难度和关键关系，仅返回约定 JSON。

[prompt:mode_a_answer]
template = 请为题目 {question_text} 生成可核验的完整解答，不省略关键推理，仅返回约定 JSON。

[prompt:mode_b_answer]
template = 请针对题目 {question_text} 生成苏格拉底式分步引导，不直接泄露最终答案，仅返回约定 JSON。

[prompt:mode_c_answer]
template = 请针对题目 {question_text} 生成启发式提示，保持与当前学习阶段一致，仅返回约定 JSON。

[prompt:result_verify]
template = 请独立验算候选结果 {candidate_result} 与题目 {question_text}，指出矛盾并返回约定 JSON。

[prompt:vision_fact_extract]
template = 请从输入图片中提取可见事实、文本、公式和布局，不补造不可见信息，仅返回约定 JSON。

[prompt:vision_page_parse]
template = 请解析试卷页面图片，保持题号、选项、公式和版面顺序，仅返回约定 JSON。

[prompt:vision_question_parse]
template = 请解析题目区域图片，输出题干、选项、公式、图示说明与答案区域，仅返回约定 JSON。

[prompt:vision_position_detect]
template = 请检测页面中题目及附属区域的位置，坐标必须基于输入图片尺寸，仅返回约定 JSON。

[prompt:guidance_generate]
template = 请结合题目 {question_text} 与学生状态 {student_context} 生成下一步学习引导，仅返回约定 JSON。

[prompt:guidance_evaluate]
template = 请评价学生回答 {student_answer} 是否体现对题目 {question_text} 的理解，仅返回约定 JSON。

[prompt:teacher_guidance_evaluate]
template = 请按教师视角评价引导内容 {guidance_text} 的准确性、启发性和泄题风险，仅返回约定 JSON。

[prompt:variant_generate]
template = 请基于原题 {question_text} 生成知识点一致但条件和表述不同的变式题，仅返回约定 JSON。

[prompt:variant_verify_deepseek]
template = 请独立验证变式题 {variant_question} 的可解性、答案和与原题的知识点一致性，仅返回约定 JSON。

[prompt:photo_recognize]
template = 请识别学生上传的题目照片，忠实输出题干、选项、公式和图示信息，仅返回约定 JSON。
