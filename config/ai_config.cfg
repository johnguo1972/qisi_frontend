  6. 题目内容要完整、准确、无歧义

  请以严格的 JSON 格式输出，不要包含任何其他文字。JSON 格式如下：
  {
      "stem": "题干内容（支持 LaTeX 公式，使用 $$ 包裹行内公式）",
      "question_type": "题型，与原题一致",
      "options": [
          {"label": "A", "content": "选项A内容"},
          {"label": "B", "content": "选项B内容"},
