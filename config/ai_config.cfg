      "analysis": "简要分析",
      "solution": "详细解题过程",
      "difficulty": 3,
      "knowledge_points": [{"module": "知识点模块", "full_label": "知识点完整标签"}],
      "variant_mode": "变式模式描述",
      "changes_from_original": "说明与原题的主要变化点"
  }

  注意事项：
